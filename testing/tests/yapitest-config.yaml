# List of default variables that can be used in all tests in this project
vars:
  default-url:
    env: BASE_URL
    default: http://127.0.0.1:8181
  sample-user:
    env: SAMPLE_USERNAME
    default: re/[A-Z][a-z]{6,12}-[0-9]{1,4}
  sample-password:
    env: SAMPLE_PASSWORD
    default: re/[a-zA-Z0-9-_]+

urls:
  base: $vars.default-url

