
# === PASS TESTS ===
# These tests exercise every assertion type and should all pass.

test-assert-bool-type:
  steps:
    - path: /api/healthz
      assert:
        status-code: 200
        body:
          healthy: +bool

test-assert-float-type:
  setup: create-user
  steps:
    - path: /api/user
      method: GET
      headers:
        API-Token: $setup.token
      assert:
        status-code: 200
        body:
          score: +float

test-assert-dict-type:
  setup: create-user
  steps:
    - id: new-post
      path: /api/post/create
      method: POST
      headers:
        API-Token: $setup.token
      data:
        title: "Dict Test Post"
        body: "Dict test content"
      assert:
        status-code: 201
    - path: /api/post/$new-post.response.post_id
      method: GET
      assert:
        status-code: 200
        body:
          meta: +dict

test-assert-len-gt-pass:
  steps:
    - path: /api/user/create
      method: POST
      data:
        username: len-gt-user-001
        password: lengtpass001!
      assert:
        status-code: 200
        body:
          token: +str
          len(token): '>10'

test-assert-len-lt-pass:
  steps:
    - path: /api/user/create
      method: POST
      data:
        username: len-lt-user-001
        password: lenltpass001!
      assert:
        status-code: 200
        body:
          token: +str
          len(token): '<100'

test-assert-len-eq-pass:
  steps:
    - path: /api/user/create
      method: POST
      data:
        username: len-eq-user-001
        password: leneqpass001!
      assert:
        status-code: 200
        body:
          token: +str
          len(token): '=20'

