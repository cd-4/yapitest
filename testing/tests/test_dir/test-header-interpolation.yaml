# Exercises inline interpolation of request headers, e.g. `Bearer $setup.token`.
# The /api/user/whoami endpoint authenticates via an `Authorization: Bearer <token>`
# header, so the variable must be spliced into the middle of the header value
# (not resolved as the whole value, which already worked previously).

# ── Positive: interpolation works ───────────────────────────────────────────

# Token from the setup step is spliced after the literal "Bearer " prefix.
# The returned name proves the exact token round-tripped to the right user.
test-header-inline-bearer-from-setup:
  setup: create-user
  steps:
    - path: /api/user/whoami
      method: GET
      headers:
        Authorization: "Bearer $setup.token"
      assert:
        status-code: 200
        body:
          name: $setup.username
          id: +int

# Token comes from a prior step's response rather than setup output.
test-header-inline-bearer-from-step:
  steps:
    - id: reg
      path: /api/user/create
      method: POST
      data:
        username: header-interp-user-001
        password: headerinterp999!
      assert:
        status-code: 200
        body:
          token: +str
    - path: /api/user/whoami
      method: GET
      headers:
        Authorization: "Bearer $reg.response.token"
      assert:
        status-code: 200
        body:
          name: header-interp-user-001
          id: +int

# Interpolating a non-token value (the username) yields a string the server
# rejects — a passing test that confirms bad credentials fail as they should.
test-header-inline-bearer-rejects-bad-token:
  setup: create-user
  steps:
    - path: /api/user/whoami
      method: GET
      headers:
        Authorization: "Bearer $setup.username"
      assert:
        status-code: 403

# ── Negative: designed to fail (assertions are intentionally wrong) ──────────

# Valid interpolated token, but the asserted name is wrong — the framework
# must report this body mismatch as a failure.
test-header-inline-wrong-name-fail:
  setup: create-user
  steps:
    - path: /api/user/whoami
      method: GET
      headers:
        Authorization: "Bearer $setup.token"
      assert:
        status-code: 200
        body:
          name: definitely-not-the-real-user

# Literal text around the variable is sent verbatim: "Token " is the wrong
# scheme, so the server returns 401. Asserting 200 must fail — proving the
# surrounding text is preserved rather than swallowed by interpolation.
test-header-inline-wrong-scheme-fail:
  setup: create-user
  steps:
    - path: /api/user/whoami
      method: GET
      headers:
        Authorization: "Token $setup.token"
      assert:
        status-code: 200
