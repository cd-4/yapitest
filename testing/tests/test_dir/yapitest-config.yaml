
step-sets:
  create-user:
    once: true
    steps:
      - id: create-user
        path: /api/user/create
        method: POST
        data:
          username: $vars.sample-user
          password: $vars.sample-password
    output:
      username: $create-user.data.username
      password: $create-user.data.password
      token: $create-user.response.token

  login:
    once: false
    steps:
      - id: do-create
        path: /api/user/create
        method: POST
        data:
          username: $args.username
          password: $args.password
      - id: do-login
        path: /api/user/login
        method: POST
        data:
          username: $args.username
          password: $args.password
    output:
      token: $do-login.response.token
      username: $args.username

