[package]
name = "yapitest"
version = "1.0.5"
edition = "2024"
description = "A YAML-based API testing framework"
license = "MIT"
repository = "https://github.com/cd-4/yapitest"
homepage = "https://cd-4.github.io/yapitest"
readme = "../README.md"

[[bin]]
name = "yapitest"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
clap = { version = "4.6.0", features = ["derive"] }
reqwest = { version = "0.13.2", features = ["json"] }
serde = {version="1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
tokio = { version = "1", features = ["full"] }
regex = "1.12.3"
dashmap = "6"
colored = "3.1.1"
lazy_static = "1.5.0"
regex_generate = "0.2.3"
rand = "0.8"
